name: InApp Build
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/inapp-patch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip >/dev/null
          mkdir -p tools
          APKT_URL=$(gh api repos/iBotPeaches/Apktool/releases/latest --jq '.assets[] | select(.name|test("apktool_.*\\.jar")) | .browser_download_url' | head -1)
          curl -fsSL -o tools/apktool.jar "$APKT_URL"
          curl -sL -o /tmp/bt.zip https://dl.google.com/android/repository/build-tools_r34-linux.zip
          unzip -q /tmp/bt.zip -d tools/bt
      - name: Decompile + apply inapp patch + rebuild
        run: |
          java -jar tools/apktool.jar d -f apk/app_patched_signed.apk -o decompiled
          if [ -d patch_inapp ]; then
            cp -rf patch_inapp/. decompiled/
          fi
          java -jar tools/apktool.jar b decompiled -o inapp-unsigned.apk
          ls -la inapp-unsigned.apk
      - name: Align + sign
        run: |
          BT=$(find tools/bt -maxdepth 1 -type d -name "android-*" | head -1)
          "$BT/zipalign" -f 4 inapp-unsigned.apk aligned.apk
          "$BT/apksigner" sign \
            --ks keystore/release.p12 \
            --ks-type PKCS12 \
            --ks-key-alias release \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app_inapp_patched.apk aligned.apk
          "$BT/apksigner" verify --print-certs app_inapp_patched.apk || true
          ls -la app_inapp_patched.apk
      - uses: actions/upload-artifact@v4
        with:
          name: app_inapp_patched
          path: app_inapp_patched.apk
